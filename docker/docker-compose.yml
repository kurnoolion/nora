# NORA + SIRA stack — two views, one image set (docker-distro design).
#
#   OPS  serve:   docker compose --profile serve up -d
#   OPS  ingest:  docker compose --profile ingest run --rm nora-pipeline <cmd>
#                 docker compose --profile ingest run --rm sira-batch   <cmd>
#                 docker compose restart sira-query
#   A/B  stacks:  docker compose -p stack-a --env-file .env.stack-a --profile serve up -d
#                 (per-stack ports/env-files via the stack .env; pooled feedback volume)
#
# Config layout:
#   .env               build + stack wiring (copy from env.example)
#   .env.<service>     runtime knobs per container (copy from env.<service>.example)
# Compose `environment:` below carries ONLY fixed container paths and
# inter-service URLs — it always wins over the env files, so those can never
# be overridden into breaking the container layout.
#
# Run compose from this docker/ directory (build context is the repo root).

name: ${STACK_NAME:-nora}

services:
  sira-query:
    build:
      context: ..
      additional_contexts:
        vendor: ./vendor
      dockerfile: docker/sira.Dockerfile
      target: sira-query
      args:
        OFFLINE: ${OFFLINE:-0}
        SIRA_REF: ${SIRA_REF:-62ec59cfb0d76f28ceb3c3d80023ac58a98e4b7a}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    image: ${IMAGE_PREFIX:-local}/sira-query:${IMAGE_TAG:-dev}
    profiles: ["serve", "dev"]
    ports:
      - "${SIRA_QUERY_PORT:-8040}:8040"
    volumes:
      - ${SIRA_DB_ROOT:?set SIRA_DB_ROOT in .env}:/data/db
      # enrichment-corrections overlay — web writes, this service READS
      # (applied at cell load; POST /cells/<cell>/reload re-applies)
      - ${CORRECTIONS_DIR:?set CORRECTIONS_DIR in .env}:/data/corrections:ro
    env_file:
      - path: ${SIRA_QUERY_ENV_FILE:-.env.sira-query}
        required: false
      - path: ${SECRETS_ENV_FILE:-.env.secrets}   # creds only; never committed
        required: false                           # (later file wins on overlap)
    environment:
      NORA_SIRA_DB_ROOT: /data/db
      NORA_SIRA_CORRECTIONS_ROOT: /data/corrections
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach host-side LLM endpoints
    restart: unless-stopped

  nora-web:
    build:
      context: ..
      additional_contexts:
        vendor: ./vendor
      dockerfile: docker/nora.Dockerfile
      target: nora-web
      args:
        OFFLINE: ${OFFLINE:-0}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    image: ${IMAGE_PREFIX:-local}/nora-web:${IMAGE_TAG:-dev}
    profiles: ["serve", "dev"]
    ports:
      - "${NORA_WEB_PORT:-8000}:8000"
    volumes:
      - ${NORA_ENV_DIR:?set NORA_ENV_DIR in .env}:/data/env
      - ${WEB_STATE_DIR:?set WEB_STATE_DIR in .env}:/data/web-state
      - ${FEEDBACK_DIR:?set FEEDBACK_DIR in .env}:/data/feedback   # pooled across stacks (D-120)
      # enrichment-corrections overlay — this app is the sole WRITER
      - ${CORRECTIONS_DIR:?}:/data/corrections
      # golden eval set (FR-38) — pooled across stacks and durable across
      # promote labels: shadows <env>/eval/golden so samples/runs never live
      # inside a promoted snapshot. Default keeps single-build setups as-is.
      - ${GOLDEN_DIR:-${NORA_ENV_DIR}/eval/golden}:/data/env/eval/golden
    env_file:
      - path: ${WEB_ENV_FILE:-.env.nora-web}
        required: false
      - path: ${SECRETS_ENV_FILE:-.env.secrets}
        required: false
    environment:
      ENV_DIR: /data/env
      NORA_JOBS_DB: /data/web-state/nora_jobs.db
      NORA_METRICS_DB: /data/web-state/nora_metrics.db
      NORA_CONFIG_DB: /data/web-state/nora_config.db
      NORA_FEEDBACK_DB: /data/feedback/nora_feedback.db
      NORA_CORRECTIONS_ROOT: /data/corrections
      NORA_SIRA_QUERY_URL: http://sira-query:8040
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - sira-query
    restart: unless-stopped

  # ------------------------------------------------ ingest jobs (no daemon) --
  nora-pipeline:
    build:
      context: ..
      additional_contexts:
        vendor: ./vendor
      dockerfile: docker/nora.Dockerfile
      target: nora-pipeline
      args:
        OFFLINE: ${OFFLINE:-0}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    image: ${IMAGE_PREFIX:-local}/nora-pipeline:${IMAGE_TAG:-dev}
    profiles: ["ingest", "dev"]
    volumes:
      - ${NORA_ENV_DIR:?}:/data/env
      - ${REQUIREMENTS_DIR:?set REQUIREMENTS_DIR in .env}:/data/requirements:ro
      - ${SIRA_DB_ROOT:?}:/data/db
      - ${MODELS_DIR:?set MODELS_DIR in .env}:/data/models
      # golden eval set — same pooled mount as nora-web, so the batch CLI
      # (core.src.eval.golden_cli) reads/writes the same samples + runs
      - ${GOLDEN_DIR:-${NORA_ENV_DIR}/eval/golden}:/data/env/eval/golden
    # Run ingest jobs as the calling user so build artifacts on the mounts
    # aren't root-owned on the host (set JOB_UID/JOB_GID in the wiring env:
    # JOB_UID=1000 / `id -u`). Default 0 = root (current behavior).
    user: "${JOB_UID:-0}:${JOB_GID:-0}"
    env_file:
      - path: ${PIPELINE_ENV_FILE:-.env.nora-pipeline}
        required: false
      - path: ${SECRETS_ENV_FILE:-.env.secrets}
        required: false
    environment:
      ENV_DIR: /data/env
      NORA_REQUIREMENTS_DIR: /data/requirements
      DOCLING_ARTIFACTS: /data/models/docling
      HF_HUB_OFFLINE: "1"
      # non-root has no home in the image; libs that write caches need one
      HOME: /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sira-batch:
    build:
      context: ..
      additional_contexts:
        vendor: ./vendor
      dockerfile: docker/sira.Dockerfile
      target: sira-batch
      args:
        OFFLINE: ${OFFLINE:-0}
        SIRA_REF: ${SIRA_REF:-62ec59cfb0d76f28ceb3c3d80023ac58a98e4b7a}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    image: ${IMAGE_PREFIX:-local}/sira-batch:${IMAGE_TAG:-dev}
    profiles: ["ingest", "dev"]
    volumes:
      - ${SIRA_DB_ROOT:?}:/data/db
      # sira_lane's adapter step reads the nora build's out/ tree
      - ${NORA_ENV_DIR:?}:/data/env
    user: "${JOB_UID:-0}:${JOB_GID:-0}"
    env_file:
      - path: ${SIRA_BATCH_ENV_FILE:-.env.sira-batch}
        required: false
      - path: ${SECRETS_ENV_FILE:-.env.secrets}
        required: false
    environment:
      HOME: /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
