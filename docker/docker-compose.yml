# NORA + SIRA stack — two views, one image set (docker-distro design).
#
#   OPS  serve:   docker compose --profile serve up -d
#   OPS  ingest:  docker compose --profile ingest run --rm nora-batch <cmd>
#                 docker compose --profile ingest run --rm sira-batch   <cmd>
#                 docker compose restart nora-store
#   A/B  stacks:  docker compose -p stack-a --env-file .env.stack-a --profile serve up -d
#                 (per-stack ports/env-files via the stack .env; pooled feedback volume)
#
# Config layout:
#   .env               build + stack wiring (copy from env.example)
#   .env.<service>     runtime knobs per container (copy from env.<service>.example)
# Compose `environment:` below carries ONLY fixed container paths and
# inter-service URLs — it always wins over the env files, so those can never
# be overridden into breaking the container layout.
#
# Run compose from this docker/ directory (build context is the repo root).

name: ${STACK_NAME:-nora}

services:
  nora-store:
    build:
      context: ..
      additional_contexts:
        vendor: ./vendor
      dockerfile: docker/store.Dockerfile
      target: nora-store
      args:
        OFFLINE: ${OFFLINE:-0}
        SIRA_REF: ${SIRA_REF:-62ec59cfb0d76f28ceb3c3d80023ac58a98e4b7a}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    image: ${IMAGE_PREFIX:-local}/nora-store:${IMAGE_TAG:-dev}
    profiles: ["serve", "dev"]
    # Serve containers default to root (0:0 — today's behavior). Set
    # SERVE_UID/SERVE_GID to the host user so bind-mount writes land
    # user-owned instead of root-owned (same pattern as JOB_UID/JOB_GID
    # on the job containers). One-time migration when switching an
    # existing deployment: chown the already-root-owned state dirs
    # (web-state, feedback, golden dir) to that user first.
    user: "${SERVE_UID:-0}:${SERVE_GID:-0}"
    ports:
      - "${STORE_PORT:-8040}:8040"
    volumes:
      # Cells: flat cell dirs or cell-*.db files. Optional once
      # SERVE_REGISTRY_ROOT is set (registry mode resolves the files itself).
      - ${STORE_ROOT:-./empty}:/data/db
      # Publish registry (corp-db-layer 4b): registry.db + versioned store
      # files, written by core.src.stores.publish on the host; read-only here.
      - ${SERVE_REGISTRY_ROOT:-./empty}:/data/serve:ro
      # enrichment-corrections overlay — this service is the Overlay
      # AUTHORITY (corp-db-layer S6): it WRITES the edits nora-web sends
      # over /stores/overlay/v1 and applies them at cell load (POST
      # /cells/<cell>/reload re-applies). Read-write mount, therefore.
      - ${CORRECTIONS_DIR:?set CORRECTIONS_DIR in .env}:/data/corrections
      # parse trees for the Trees store (/stores/trees/v1): the Requirement
      # Browser, /api/req and the Eval Studio picker read them from here
      # once nora-web sets NORA_TREES_URL. Read-only: nora-store never
      # writes under the env dir.
      - ${NORA_ENV_DIR:?set NORA_ENV_DIR in .env}:/data/env:ro
      # Pre-built SQLite stores, optional: set TREES_ROOT / HISTORY_ROOT in
      # the wiring .env. Unset mounts an empty dir and leaves the matching
      # NORA_*_ROOT empty, so the store falls back (Trees: the parse trees
      # under /data/env; History: not served).
      - ${TREES_ROOT:-./empty}:/data/trees:ro        # trees-<mno>-<release>.db
      - ${HISTORY_ROOT:-./empty}:/data/history:ro    # history-<mno>.db
    env_file:
      - path: ${STORE_ENV_FILE:-.env.nora-store}
        required: false
      - path: ${SECRETS_ENV_FILE:-.env.secrets}   # creds only; never committed
        required: false                           # (later file wins on overlap)
    environment:
      NORA_STORE_ROOT: /data/db
      NORA_STORE_CORRECTIONS_ROOT: /data/corrections
      NORA_ENV_DIR: /data/env
      # Set only when the host variable is set (compose `:+`): empty means
      # "not configured" to the store factories.
      NORA_TREES_ROOT: ${TREES_ROOT:+/data/trees}
      NORA_HISTORY_ROOT: ${HISTORY_ROOT:+/data/history}
      NORA_STORE_REGISTRY: ${SERVE_REGISTRY_ROOT:+/data/serve/registry.db}
      NORA_STORE_RELEASE_SET: ${SERVE_RELEASE_SET:-}
      # SERVE_UID has no passwd entry in the image, so HOME would be `/`;
      # libs that write caches need a writable one. Serving never fetches
      # from the HuggingFace hub (embeddings/rerank come from a TEI server).
      HOME: /tmp
      HF_HUB_OFFLINE: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach host-side LLM endpoints
    restart: unless-stopped

  nora-web:
    build:
      context: ..
      additional_contexts:
        vendor: ./vendor
      dockerfile: docker/nora.Dockerfile
      target: nora-web
      args:
        OFFLINE: ${OFFLINE:-0}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    image: ${IMAGE_PREFIX:-local}/nora-web:${IMAGE_TAG:-dev}
    profiles: ["serve", "dev"]
    # See nora-store: default 0:0 is today's behavior; set SERVE_UID and
    # SERVE_GID so web-state/feedback/corrections/golden writes land
    # user-owned.
    user: "${SERVE_UID:-0}:${SERVE_GID:-0}"
    ports:
      - "${NORA_WEB_PORT:-8000}:8000"
    volumes:
      - ${NORA_ENV_DIR:?set NORA_ENV_DIR in .env}:/data/env
      - ${WEB_STATE_DIR:?set WEB_STATE_DIR in .env}:/data/web-state
      - ${FEEDBACK_DIR:?set FEEDBACK_DIR in .env}:/data/feedback   # pooled across stacks (D-120)
      # enrichment-corrections overlay — the dev FALLBACK (local backend).
      # With NORA_OVERLAY_URL set below (the default) every review edit goes
      # to nora-store over HTTP and this mount is unused; the same holds for
      # the parse trees under /data/env once NORA_TREES_URL is set. Kept so
      # a stack with the URLs unset keeps working as before.
      - ${CORRECTIONS_DIR:?}:/data/corrections
      # golden eval set (FR-38) — pooled across stacks and durable across
      # promote labels: shadows <env>/eval/golden so samples/runs never live
      # inside a promoted snapshot. Default keeps single-build setups as-is.
      - ${GOLDEN_DIR:-${NORA_ENV_DIR}/eval/golden}:/data/env/eval/golden
    env_file:
      - path: ${WEB_ENV_FILE:-.env.nora-web}
        required: false
      - path: ${SECRETS_ENV_FILE:-.env.secrets}
        required: false
    environment:
      ENV_DIR: /data/env
      # See nora-store: a writable HOME for non-root, and no hub fetches.
      HOME: /tmp
      HF_HUB_OFFLINE: "1"
      NORA_JOBS_DB: /data/web-state/nora_jobs.db
      NORA_METRICS_DB: /data/web-state/nora_metrics.db
      NORA_CONFIG_DB: /data/web-state/nora_config.db
      NORA_FEEDBACK_DB: /data/feedback/nora_feedback.db
      NORA_CORRECTIONS_ROOT: /data/corrections
      NORA_STORE_URL: http://nora-store:8040
      # Store clients (corp-db-layer S6): nora-web is a web layer and reads
      # the Overlay, Trees and History through nora-store's /stores routes.
      # Interpolated from the wiring .env (not .env.nora-web — compose
      # `environment:` wins over env files): set one to empty there to fall
      # back to the local backend, or to another stack's nora-store to
      # share its Overlay (that store is then the authority; see
      # env.nora-store.example).
      NORA_OVERLAY_URL: ${NORA_OVERLAY_URL-http://nora-store:8040}
      NORA_TREES_URL: ${NORA_TREES_URL-http://nora-store:8040}
      NORA_HISTORY_URL: ${NORA_HISTORY_URL-http://nora-store:8040}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - nora-store
    restart: unless-stopped

  # ------------------------------------------------ ingest jobs (no daemon) --
  nora-batch:
    build:
      context: ..
      additional_contexts:
        vendor: ./vendor
      dockerfile: docker/nora.Dockerfile
      target: nora-batch
      args:
        OFFLINE: ${OFFLINE:-0}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    image: ${IMAGE_PREFIX:-local}/nora-batch:${IMAGE_TAG:-dev}
    profiles: ["ingest", "dev"]
    volumes:
      - ${NORA_ENV_DIR:?}:/data/env
      - ${REQUIREMENTS_DIR:?set REQUIREMENTS_DIR in .env}:/data/requirements:ro
      - ${STORE_ROOT:-./empty}:/data/db   # optional in registry mode (serve only)
      - ${MODELS_DIR:?set MODELS_DIR in .env}:/data/models
      # golden eval set — same pooled mount as nora-web, so the batch CLI
      # (core.src.eval.golden_cli) reads/writes the same samples + runs
      - ${GOLDEN_DIR:-${NORA_ENV_DIR}/eval/golden}:/data/env/eval/golden
    # Run ingest jobs as the calling user so build artifacts on the mounts
    # aren't root-owned on the host (set JOB_UID/JOB_GID in the wiring env:
    # JOB_UID=1000 / `id -u`). Default 0 = root (current behavior).
    user: "${JOB_UID:-0}:${JOB_GID:-0}"
    env_file:
      - path: ${BATCH_ENV_FILE:-.env.nora-batch}
        required: false
      - path: ${SECRETS_ENV_FILE:-.env.secrets}
        required: false
    environment:
      ENV_DIR: /data/env
      NORA_REQUIREMENTS_DIR: /data/requirements
      DOCLING_ARTIFACTS: /data/models/docling
      HF_HUB_OFFLINE: "1"
      # non-root has no home in the image; libs that write caches need one
      HOME: /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sira-batch:
    build:
      context: ..
      additional_contexts:
        vendor: ./vendor
      dockerfile: docker/store.Dockerfile
      target: sira-batch
      args:
        OFFLINE: ${OFFLINE:-0}
        SIRA_REF: ${SIRA_REF:-62ec59cfb0d76f28ceb3c3d80023ac58a98e4b7a}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    image: ${IMAGE_PREFIX:-local}/sira-batch:${IMAGE_TAG:-dev}
    profiles: ["ingest", "dev"]
    volumes:
      - ${STORE_ROOT:-./empty}:/data/db   # optional in registry mode (serve only)
      # sira_lane's adapter step reads the nora build's out/ tree
      - ${NORA_ENV_DIR:?}:/data/env
    user: "${JOB_UID:-0}:${JOB_GID:-0}"
    env_file:
      - path: ${SIRA_BATCH_ENV_FILE:-.env.sira-batch}
        required: false
      - path: ${SECRETS_ENV_FILE:-.env.secrets}
        required: false
    environment:
      HOME: /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
