#
# SIRA enrichment overrides for the NORA telecom corpus. Inherits the
# parameter defaults from scripts/configs/enrich/default.yaml and only
# swaps the prompt files to our v01 telecom variants.
#
# The `defaults` list pulls in default.yaml FIRST, then layers our two
# overrides on top via `_self_`. Without this, `enrich=nora` replaces
# the enrich subtree wholesale and CLI overrides like
# `enrich.concurrency=8` fail with ConfigCompositionException
# "Could not override 'enrich.concurrency'".

defaults:
  - default
  - _self_
#
# Default parameters carried over (NOT redefined here so changes upstream
# in default.yaml propagate cleanly):
#   max_docs: 0           — process all docs
#   max_doc_chars: 4000   — char cap per requirement before sending to LLM.
#                            NORA reqs are typically <2000 chars; rare table-
#                            heavy chunks may hit this cap.
#   concurrency: 4096     — parallel LLM requests. We override below to 1
#                            for the work-PC proxy-throttled environment.
#   doc_max_tokens: 2048  — generation cap per enrichment call.
#   query_max_tokens: 1024
#   temperature: 0.4
#   seed: 42
#   max_n: 4              — max words per generated phrase.
#   max_df_ratio: 0.05    — DF-filter cap (drop terms in >5% of corpus —
#                            the discriminative-term invariant from D-DRAFT-1).
#   tokenizer: unicode_stem
#
# Default to modest parallelism. With the shim routing to the
# unthrottled local LLM endpoint, 4 in-flight requests are comfortable
# without saturating the backend. The corporate-proxy path that
# previously forced strict serial (=1) is now bypassed. Raise further
# on bigger backends. Note: this YAML override is applied AFTER
# Hydra CLI overrides, so editing here is the right place to tune —
# CLI `++enrich.concurrency=N` is silently re-stomped by this file.
concurrency: 4

doc_prompt_file: configs/enrich/prompts/doc_requirement_v01.txt
query_prompt_file: configs/enrich/prompts/query_requirement_v01.txt
